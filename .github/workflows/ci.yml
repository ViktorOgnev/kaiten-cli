name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Check locale catalog
        run: python scripts/check_locales.py
      - name: Check generated documentation
        run: python scripts/generate_reference_docs.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run test suite
        run: pytest -q

  document-yjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/document-yjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/document-yjs/package-lock.json
      - name: Install maintainer dependencies
        run: npm ci --ignore-scripts
      - name: Verify the checked-in helper build
        run: |
          npm run build
          git diff --exit-code -- ../../src/kaiten_cli/assets
      - name: Test document synchronization
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Enforce branch coverage
        run: pytest -q --cov=kaiten_cli --cov-branch --cov-report=term-missing --cov-fail-under=75

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and auditor
        run: python -m pip install --upgrade pip "setuptools>=83" pip-audit && python -m pip install .
      - name: Audit installed dependencies
        run: python -m pip_audit --local

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package descriptions
        run: python -m twine check --strict dist/*
      - name: Check archive versions and record SHA256
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_release.py artifacts --tag "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python scripts/check_release.py artifacts | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      PIPX_HOME: ${{ github.workspace }}/.pipx
      PIPX_BIN_DIR: ${{ github.workspace }}/.bin
      UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.bin
      KAITEN_DOMAIN: ''
      KAITEN_TOKEN: ''
      KAITEN_CLI_UPDATE_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Isolate CLI configuration and trace
        run: |
          echo "KAITEN_CLI_CONFIG_PATH=$RUNNER_TEMP/smoke-config.json" >> "$GITHUB_ENV"
          echo "KAITEN_TRACE_FILE=$RUNNER_TEMP/install-smoke.jsonl" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Install packaging tools
        run: python -m pip install --upgrade pip uv pipx
      - name: Expose tool bin dir
        run: echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"
      - name: Install wheel into the runner Python
        run: python -m pip install dist/*.whl
      - name: Verify wheel import and CLI
        run: |
          python -I -c "import kaiten_cli; print(kaiten_cli.__version__)"
          kaiten --locale ru --version
          kaiten --locale ru --help
          kaiten --locale ru search-tools cards
      - name: Install wheel via pipx
        run: python -m pipx install dist/*.whl
      - name: Verify pipx-installed CLI
        run: |
          "$PIPX_HOME/venvs/kaiten-cli/bin/python" -I -c "import kaiten_cli; print(kaiten_cli.__version__)"
          kaiten --locale ru --version
          kaiten --locale ru --help
          kaiten --locale ru search-tools cards
      - name: Remove pipx install
        run: python -m pipx uninstall kaiten-cli
      - name: Install wheel via uv
        run: uv tool install dist/*.whl
      - name: Verify uv-installed CLI
        run: |
          "$UV_TOOL_DIR/kaiten-cli/bin/python" -I -c "import kaiten_cli; print(kaiten_cli.__version__)"
          kaiten --locale ru --version
          kaiten --locale ru --help
          kaiten --locale ru search-tools cards
      - name: Install sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
      - name: Verify sdist import and CLI
        run: |
          "$RUNNER_TEMP/sdist-smoke/bin/python" -I -c "import kaiten_cli; print(kaiten_cli.__version__)"
          "$RUNNER_TEMP/sdist-smoke/bin/kaiten" --locale ru --version
          "$RUNNER_TEMP/sdist-smoke/bin/kaiten" --locale ru --help
          "$RUNNER_TEMP/sdist-smoke/bin/kaiten" --locale ru search-tools cards
      - name: Summarize installation smoke trace
        run: python -m kaiten_cli --locale ru --json trace summarize --file "$KAITEN_TRACE_FILE"
